<text text-anchor="start" x="209.5" y="-529" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="30.00" fill="#ffffff">ImuService</text>
<text text-anchor="start" x="58" y="-503.8" font-family="Helvetica,Arial,sans-serif" font-size="24.00" fill="#ffffff">Consumes raw accelerometer/gyroscope</text>
<text text-anchor="start" x="99.5" y="-479.8" font-family="Helvetica,Arial,sans-serif" font-size="24.00" fill="#ffffff">samples and publishes `ImuData`</text>
<text text-anchor="start" x="140.5" y="-455.8" font-family="Helvetica,Arial,sans-serif" font-size="24.00" fill="#ffffff">samples that represent the</text>
<text text-anchor="start" x="109" y="-431.8" font-family="Helvetica,Arial,sans-serif" font-size="24.00" fill="#ffffff">controller&#39;s current view of body</text>
<text text-anchor="start" x="101.5" y="-407.8" font-family="Helvetica,Arial,sans-serif" font-size="24.00" fill="#ffffff">pitch, specific force, angular rate,</text>
<text text-anchor="start" x="199" y="-383.8" font-family="Helvetica,Arial,sans-serif" font-size="24.00" fill="#ffffff">and sample time.</text>
</g>
