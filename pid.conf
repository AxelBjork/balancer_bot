# Balancer Bot Controller Configuration
# Modifying this file requires application restart (or reload logic)
# Authoritative shared simulator/hardware default. This is the current
# StepperPhaseElectrical-calibrated controller profile; simulator validation is
# not by itself hardware safety proof.

config_version       = 10

# --- Explicit attitude state feedback ---
pitch_gain          = 203550
pitch_rate_gain     = 1932
pitch_accel_gain    = 14.7
# The locked 29 Hz / 10 Hz gyro notch is compiled into the IMU estimator.

# --- Acceleration / velocity control / stationary COM trim / allocation ---
drive_max_acceleration_mps2 = 0.25
velocity_damping_per_s = 5.5
# Dedicated velocity-to-pitch authority; total pitch safety remains separate.
velocity_pitch_limit_deg = 2.5
velocity_I           = 0.001
velocity_I_limit_deg = 4
# Dedicated velocity-control bandwidth, separate from the completed-step observer.
velocity_control_cutoff_hz = 0.68
drive_max_sps        = 1200
turn_max_sps         = 1600
balance_max_sps      = 16000
controller_enabled   = 1
