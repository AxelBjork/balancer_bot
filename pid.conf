# Balancer Bot Controller Configuration
# Modifying this file requires application restart (or reload logic)
# Authoritative shared simulator/hardware default. This is the current
# StepperPhaseElectrical-calibrated controller profile; simulator validation is
# not by itself hardware safety proof.

config_version       = 12

# --- Explicit attitude state feedback ---
pitch_gain          = 203550
pitch_rate_gain     = 1932
pitch_accel_gain    = 0
# The locked 29 Hz / 10 Hz gyro notch is compiled into the IMU estimator.

# --- Velocity-reference outer loop / fixed COM trim ---
drive_max_velocity_mps = 0.12
velocity_gain_per_s = 0.5
velocity_feedback_cutoff_hz = 0.68
outer_pitch_limit_deg = 10
fixed_com_trim_deg = 0
adaptive_com_trim_enabled = 0
adaptive_com_trim_gain_deg_per_mps_s = 0
adaptive_com_trim_limit_deg = 4
turn_max_sps         = 1600
balance_max_sps      = 16000
planner_max_acceleration_mps2 = 0.25
planner_max_deceleration_mps2 = 0.25
planner_max_jerk_mps3 = 1
velocity_i_gain_per_s2 = 0
velocity_i_leak_time_s = 2
velocity_i_acceleration_limit_mps2 = 0.25
controller_enabled   = 1
