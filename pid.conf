# Balancer Bot Controller Configuration
# Modifying this file requires application restart (or reload logic)
# Authoritative shared simulator/hardware default. This is the current
# StepperPhaseElectrical simulator-selected profile; simulator validation is
# not by itself hardware safety proof.

config_version       = 12

# --- Explicit attitude state feedback ---
# A held forward/recovery request bounds these neutral gains to the compiled
# 145 k/250 recovery baseline, blends pitch stiffness to 32 kSPS/rad by 50
# degrees, and applies the emitted-STEP/chassis-rotation coordinate correction
# documented in control_plant.md.
pitch_gain          = 173018
pitch_rate_gain     = 150
pitch_accel_gain    = 0
# The locked structural gyro notches are compiled into the IMU estimator.

# --- Velocity-reference outer loop / fixed COM trim ---
drive_max_velocity_mps = 0.3
# Broad stable moving-operating-point region from the 2026-08-29 simulator
# sweep. This is simulator evidence only; it has not been hardware-validated.
velocity_gain_per_s = 9.12525
velocity_feedback_cutoff_hz = 0.85
outer_pitch_limit_deg = 10
fixed_com_trim_deg = 0
adaptive_com_trim_enabled = 0
adaptive_com_trim_gain_deg_per_mps_s = 0
adaptive_com_trim_limit_deg = 4
turn_max_sps         = 1600
balance_max_sps      = 48000
planner_max_acceleration_mps2 = 0.25
planner_max_deceleration_mps2 = 0.25
planner_max_jerk_mps3 = 1
velocity_i_gain_per_s2 = 0
velocity_i_leak_time_s = 2
velocity_i_acceleration_limit_mps2 = 0.25
controller_enabled   = 1
