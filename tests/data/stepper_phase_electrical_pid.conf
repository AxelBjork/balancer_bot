# Simulator-only controller configuration for the validated 1/32
# StepperPhaseElectrical plant. Keep this separate from pid.conf: the
# different attitude gains are deliberate plant evidence, not a hidden
# model-specific multiplier. The existing outer-loop terms remain enabled so
# drive, stop, reversal, and COM scenarios can expose their own tuning gaps.

config_version       = 10

# --- Explicit attitude state feedback ---
pitch_gain          = 280000
pitch_rate_gain     = 12000
pitch_accel_gain    = 0

# --- Acceleration / velocity control / stationary COM trim / allocation ---
drive_max_acceleration_mps2 = 1.25
velocity_damping_per_s = 8
velocity_pitch_limit_deg = 4
velocity_I           = 0.001
velocity_I_limit_deg = 4
velocity_control_cutoff_hz = 3
drive_max_sps        = 1200
turn_max_sps         = 1600
balance_max_sps      = 16000
controller_enabled   = 1
