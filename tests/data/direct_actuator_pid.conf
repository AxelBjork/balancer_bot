# Frozen DirectActuator controller reference.
# The maintained default pid.conf now uses the StepperPhaseElectrical profile;
# keep this file for explicit historical DirectActuator comparisons.

config_version       = 10

# --- Explicit attitude state feedback ---
pitch_gain          = 6000
pitch_rate_gain     = 350
pitch_accel_gain    = 0
# The locked 29 Hz / 10 Hz gyro notch is compiled into the IMU estimator.

# --- Acceleration / velocity control / stationary COM trim / allocation ---
drive_max_acceleration_mps2 = 1.25
velocity_damping_per_s = 8
velocity_pitch_limit_deg = 4
velocity_I           = 0.001
velocity_I_limit_deg = 4
velocity_control_cutoff_hz = 3
drive_max_sps        = 1200
turn_max_sps         = 1600
balance_max_sps      = 16000
controller_enabled   = 1
