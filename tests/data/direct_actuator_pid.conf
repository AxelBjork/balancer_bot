# Frozen DirectActuator controller reference.
# The maintained default pid.conf now uses the StepperPhaseElectrical profile;
# keep this file for explicit historical DirectActuator comparisons.

config_version       = 12

# --- Explicit attitude state feedback ---
pitch_gain          = 6000
pitch_rate_gain     = 350
pitch_accel_gain    = 0
# The legacy DirectActuator simulator fixture retains the current 32 Hz /
# 10 Hz gyro notch and 30 Hz software LPF. Production hardware uses the
# ISM330 LPF1 plus the 33.4 Hz notch instead.

# --- Velocity-reference outer loop / fixed COM trim ---
drive_max_velocity_mps = 0.12
velocity_gain_per_s = 0.5
velocity_feedback_cutoff_hz = 3
outer_pitch_limit_deg = 4
fixed_com_trim_deg = 0
adaptive_com_trim_enabled = 0
adaptive_com_trim_gain_deg_per_mps_s = 0
adaptive_com_trim_limit_deg = 4
turn_max_sps         = 1600
balance_max_sps      = 16000
planner_max_acceleration_mps2 = 1.25
planner_max_deceleration_mps2 = 1.25
planner_max_jerk_mps3 = 5
velocity_i_gain_per_s2 = 0
velocity_i_leak_time_s = 2
velocity_i_acceleration_limit_mps2 = 0.25
controller_enabled   = 1
