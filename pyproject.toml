[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "balancer-bot"
version = "0.0.0"
dependencies = [
    "pandas",
    "matplotlib",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-p no:cov -p no:xdist"
cache_dir = "build/.pytest_cache"

[tool.flake8]
max-line-length = 100

[tool.black]
line-length = 100
